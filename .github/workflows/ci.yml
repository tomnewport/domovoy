name: Build

on:
  push:
    branches:
      - main
      - dev

jobs:

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Packages and Build Application
        run: |
          cd domovoy_app
          npm ci
          npm run build

      - name: Copy Built Files via SCP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_DEPLOY_DIR: /opt/applications/domovoy/${GITHUB_HEAD_REF}
        run: |
          echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF})"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo ${SSH_USER}
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} mkdir -p ${SSH_DEPLOY_DIR}/app/
          scp -r domovoy_app/dist ${SSH_USER}@${SSH_HOST}:${SSH_DEPLOY_DIR}/app/
          rm -f ~/.ssh/id_rsa

  build-api:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build the Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/domovoy:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/domovoy:latest

      - name: Template out file
        uses: danielr1996/envsubst-action@1.0.0
        env:
          PORT: {{ '14520' if $GITHUB_HEAD_REF == 'dev' else '14521' }}
          INSTANCE: staging
        with:
          input: deploy/docker-compose.yml
          output: docker-compose.yml

      - name: Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          COMPOSE_FILE: docker-compose.yml
          SSH_DEPLOY_DIR: /opt/applications/domovoy/${GITHUB_HEAD_REF}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} pwd
          scp -r ${COMPOSE_FILE} ${SSH_USER}@${SSH_HOST}:${SSH_DEPLOY_DIR}
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "cd ${SSH_DEPLOY_DIR} && docker-compose up -d"
          rm -f ~/.ssh/id_rsa