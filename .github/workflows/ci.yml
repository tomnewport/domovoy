name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:

  checks:
    name: Lint, Test and Type-check
    runs-on: ubuntu-latest
    env:
      # Dummy, non-secret values so Django settings load (see domovoy/domovoy/environment.py).
      domovoy_server_secret_key: ci-not-a-secret
      domovoy_smtp_server: localhost
      domovoy_smtp_port: "25"
      domovoy_smtp_username: ci
      domovoy_smtp_password: ci
      domovoy_frontend_root: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Poetry
        run: pipx install poetry==2.4.3

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install backend dependencies
        run: |
          poetry env use "$(which python)"
          poetry install --no-interaction

      - name: Ruff
        run: poetry run ruff check .

      # manage.py lives in domovoy/, but the Poetry project is the repo root.
      - name: Django system checks
        working-directory: domovoy
        run: poetry -P .. run python manage.py check

      - name: Check for missing migrations
        working-directory: domovoy
        run: poetry -P .. run python manage.py makemigrations --check --dry-run

      - name: Django tests
        working-directory: domovoy
        run: poetry -P .. run python manage.py test

      - name: Export OpenAPI schema
        working-directory: domovoy
        run: >-
          poetry -P .. run python manage.py shell -c
          "from django.core.management import call_command;
          from ninja.management.commands.export_openapi_schema import Command;
          call_command(Command(), output='$RUNNER_TEMP/openapi.json')"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: domovoy_app/package-lock.json

      - name: Install frontend dependencies
        working-directory: domovoy_app
        run: npm ci

      - name: ESLint
        working-directory: domovoy_app
        run: npm run lint:check

      - name: Check generated API types are up to date
        working-directory: domovoy_app
        run: |
          npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o src/services/domovoy/schema.d.ts
          git diff --exit-code -- src/services/domovoy/schema.d.ts \
            || { echo "::error::schema.d.ts is stale. Run 'npm run domovoy-types' against the backend and commit the result."; exit 1; }

      - name: Type-check and build
        working-directory: domovoy_app
        run: npm run build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install Dependencies and Build
        run: |
          cd domovoy_app
          npm ci
          npm run build

      - name: Deploy Frontend via SCP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_DIR: /opt/applications/domovoy/${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mkdir -p ${DEPLOY_DIR}/html/"
          scp -r domovoy_app/dist/* ${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/html/
          rm -f ~/.ssh/id_rsa

  build-api:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    needs: [checks, build-frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/domovoy:${{ github.ref_name }} .

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/domovoy:${{ github.ref_name }}

      - name: Template secrets
        env:
          ENV_BACKEND_DEV: ${{ secrets.ENV_BACKEND_DEV }}
          ENV_BACKEND_PROD: ${{ secrets.ENV_BACKEND_PROD }}
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "$ENV_BACKEND_DEV" > .env
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "$ENV_BACKEND_PROD" > .env
          fi

      - name: Template Docker Compose File
        uses: danielr1996/envsubst-action@2e31f00366f390d8155c6a72a12ef93747d690d3 # 1.0.0
        env:
          HOST_PORT: ${{ github.ref_name == 'main' && '14520' || '14521' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        with:
          input: deploy/docker-compose.yml
          output: docker-compose.yml

      - name: Template Nginx Config
        uses: danielr1996/envsubst-action@2e31f00366f390d8155c6a72a12ef93747d690d3 # 1.0.0
        env:
          HOST_PORT: ${{ github.ref_name == 'main' && '14520' || '14521' }}
          HOST_NAME: ${{ github.ref_name == 'main' && 'domovoy' || 'dom-dev' }}
          DEPLOY_DIR: /opt/applications/domovoy/${{ github.ref_name }}
          uri: $uri
          host: $host
          remote_addr: $remote_addr
          proxy_add_x_forwarded_for: $proxy_add_x_forwarded_for
          scheme: $scheme
          request_uri: $request_uri
        with:
          input: deploy/site.conf
          output: site.conf

      - name: Deploy API via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_DIR: /opt/applications/domovoy/${{ github.ref_name }}
          COMPOSE_FILE: docker-compose.yml
          HOST_NAME: ${{ github.ref_name == 'main' && 'domovoy' || 'dom-dev' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          scp -o StrictHostKeyChecking=no ${COMPOSE_FILE} ${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}
          scp -o StrictHostKeyChecking=no .env ${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/.env
          scp -o StrictHostKeyChecking=no site.conf ${SSH_USER}@${SSH_HOST}:/etc/nginx/sites-available/$HOST_NAME.conf
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "cd ${DEPLOY_DIR} && docker system prune --all -f && docker-compose pull && docker-compose up -d"
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "cd ${DEPLOY_DIR} && docker-compose exec -T domovoy poetry run python manage.py migrate"
          rm -f ~/.ssh/id_rsa
