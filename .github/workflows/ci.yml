name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  # "Run workflow" in the Actions tab deploys the chosen branch to dev (after
  # the same checks). There is no dev branch: dev is reset to main on every
  # merge, and anything can be tried on it in between.
  workflow_dispatch:

permissions:
  contents: read

jobs:

  checks:
    name: Lint, Test and Type-check
    runs-on: ubuntu-latest
    env:
      # Dummy, non-secret values so Django settings load (see domovoy/domovoy/environment.py).
      domovoy_server_secret_key: ci-not-a-secret
      domovoy_smtp_server: localhost
      domovoy_smtp_port: "25"
      domovoy_smtp_username: ci
      domovoy_smtp_password: ci
      domovoy_frontend_root: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv installs the Python in .python-version and the locked dependencies.
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      # manage.py lives in domovoy/; uv finds the project in the repo root.
      - name: Django system checks
        working-directory: domovoy
        run: uv run python manage.py check

      - name: Check for missing migrations
        working-directory: domovoy
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django tests
        working-directory: domovoy
        run: uv run python manage.py test

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: domovoy_app/.nvmrc
          cache: npm
          cache-dependency-path: domovoy_app/package-lock.json

      - name: Install frontend dependencies
        working-directory: domovoy_app
        run: npm ci

      - name: ESLint
        working-directory: domovoy_app
        run: npm run lint:check

      # Same script as `npm run domovoy-types`: exports the schema from Django
      # (no server) and regenerates the client types.
      - name: Check generated API types are up to date
        working-directory: domovoy_app
        run: |
          npm run domovoy-types
          git diff --exit-code -- src/services/domovoy/schema.d.ts \
            || { echo "::error::schema.d.ts is stale. Run 'npm run domovoy-types' (no server needed) and commit the result."; exit 1; }

      - name: Type-check and build
        working-directory: domovoy_app
        run: npm run build

  # The Django tests again, on Postgres like production (`checks` uses SQLite).
  tests-postgres:
    name: Tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18  # Neon production runs 18
        env:
          POSTGRES_USER: domovoy
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: domovoy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domovoy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      domovoy_server_secret_key: ci-not-a-secret
      domovoy_smtp_server: localhost
      domovoy_smtp_port: "25"
      domovoy_smtp_username: ci
      domovoy_smtp_password: ci
      domovoy_frontend_root: http://localhost:5173
      domovoy_database_url: postgresql://domovoy:ci-not-a-secret@localhost:5432/domovoy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv installs the Python in .python-version and the locked dependencies.
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Django tests
        working-directory: domovoy
        run: uv run python manage.py test --noinput

  # Deployment (docs/DEPLOY_GCP.md). Off unless the repository variable
  # GCP_DEPLOY_ENABLED is "true", which doubles as a switch to pause deploys.
  #
  # Push to main:   deploy prod -> reset dev's database from prod -> deploy dev
  # Run workflow:   deploy the chosen branch to dev (database left as it is)

  deploy-prod:
    name: Deploy prod
    needs: [checks, tests-postgres]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.GCP_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-gcp.yml
    with:
      environment: prod

  # Dev starts each cycle as a copy of prod: Neon's dev branch is reset to the
  # head of its parent, production. Runs as the prod deployer, the only
  # identity allowed to read the Neon API key (and only from main).
  reset-dev-database:
    name: Reset dev database from prod
    runs-on: ubuntu-latest
    needs: deploy-prod
    # Shares dev's lock, so a manual dev deploy can't run mid-reset.
    concurrency:
      group: gcp-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_PROD_DEPLOYER_SA }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          creds="$RUNNER_TEMP/gcp-credentials.json"
          gcloud iam workload-identity-pools create-cred-config "$GCP_WIF_PROVIDER" \
            --service-account="$DEPLOYER_SA" \
            --credential-source-url="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$GCP_WIF_PROVIDER" \
            --credential-source-headers="Authorization=Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --credential-source-type=json --credential-source-field-name=value \
            --output-file="$creds"
          gcloud auth login --cred-file="$creds" --quiet
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Reset Neon dev branch to production
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          NEON_API_KEY="$(gcloud secrets versions access latest --secret=domovoy-neon-api-key)"
          echo "::add-mask::$NEON_API_KEY"
          export NEON_API_KEY
          python3 deploy/gcp/reset-dev-database.py

  deploy-dev:
    name: Deploy dev
    needs: [checks, tests-postgres, deploy-prod, reset-dev-database]
    # On main this follows a successful prod deploy and database reset; on a
    # manual run those two are skipped, so check results explicitly.
    if: >-
      !cancelled()
      && vars.GCP_DEPLOY_ENABLED == 'true'
      && needs.checks.result == 'success'
      && needs.tests-postgres.result == 'success'
      && (
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
            && needs.reset-dev-database.result == 'success')
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-gcp.yml
    with:
      environment: dev
