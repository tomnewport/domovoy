name: Build

on:
    push:
        branches:
            - master

jobs:
    build:
      name: Build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Create Node Environment
          uses: actions/setup-node@v4
          with:
            node-version: 16.x

        - name: Install Packages and Build Application
          run: |
            cd domovoy_app
            npm ci
            npm run build

        - name: Copy Built Files via SCP
          env:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_DEPLOY_DIR: /opt/applications/domovoy/prod
          run: |
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            echo ${SSH_USER}
            ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} mkdir -p ${SSH_DEPLOY_DIR}/app/
            scp -r domovoy_app/build ${SSH_USER}@${SSH_HOST}:${SSH_DEPLOY_DIR}/app/
            rm -f ~/.ssh/id_rsa
