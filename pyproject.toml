[project]
name = "domovoy"
version = "0.1.0"
description = "Household chore sharing: a Django + django-ninja API behind a Vue SPA"
authors = [{ name = "Tom Newport", email = "tom.newport@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<7",
    "django-ninja>=1.8,<2",
    "uvicorn>=0.54,<0.55",
    "pydantic[email]>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "django-cors-headers>=4.9,<5",
    "python-dateutil>=4.0,<5",
    "psycopg[binary]>=3.3,<4",
    "dj-database-url>=3.1,<4",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = ["ruff>=0.17,<0.18"]

[tool.uv]
# An application, not a library: uv installs the dependencies only.
package = false
required-version = ">=0.13.10"

[tool.ruff.lint]
# The rules the codebase has always passed. Ruff 0.17's wider default set
# (isort, pyupgrade, bugbear, RUF, ...) can be adopted in a follow-up.
select = ["E4", "E7", "E9", "F"]
